server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API + SSE streams (research events, chat) — buffering off so tokens flush live.
    location /v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
