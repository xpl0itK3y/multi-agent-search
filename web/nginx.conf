# Public share links carry their bearer token in the path (/r/<token> in the SPA,
# /v1/public/research/<token> in the API), and the page's own asset/API requests
# repeat it in the Referer. stdout is shipped to Loki, so log a redacted copy of both.
map $request_uri $redacted_request_uri {
    default $request_uri;
    "~^(?<share_uri_head>/(?:v1/public/research|r)/)[^/?]+(?<share_uri_tail>.*)$" "${share_uri_head}[redacted]${share_uri_tail}";
}

map $http_referer $redacted_http_referer {
    default $http_referer;
    "" "-";
    "~^(?<share_ref_head>https?://[^/]+/(?:v1/public/research|r)/)[^/?]+(?<share_ref_tail>.*)$" "${share_ref_head}[redacted]${share_ref_tail}";
}

# The stock "main" format, with the request line and Referer redacted.
log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $redacted_request_uri $server_protocol" '
                    '$status $body_bytes_sent "$redacted_http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log redacted;

    # Docker internal DNS resolver — dynamically resolves upstream IPs every 10s
    # so restarts/recreations of backend containers do not cause persistent 502 Bad Gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # API + SSE streams (research events, chat) — buffering off so tokens flush live.
    location /v1/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # nginx is the edge, so overwrite (never append to) the client's forwarding
        # headers: uvicorn trusts X-Forwarded-For (--forwarded-allow-ips), and the login
        # rate limiter and audit logs key on the address it yields. There is no
        # Cloudflare in front of this proxy, so a CF-Connecting-IP header is forged.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location /health {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
    }

    # Prometheus scrapes the API directly over the Docker network. Do not expose
    # metric labels (or any accidentally high-cardinality data) through the SPA.
    location = /metrics {
        return 404;
    }

    # index.html points at content-hashed bundles, so browsers must revalidate it on
    # every load; a cached copy after a deploy requests bundles that no longer exist.
    # The SPA fallback and the `index` for "/" both land here through an internal
    # redirect to /index.html, while the hashed assets keep nginx's default caching.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
