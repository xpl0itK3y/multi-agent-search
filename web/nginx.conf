server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS resolver — dynamically resolves upstream IPs every 10s
    # so restarts/recreations of backend containers do not cause persistent 502 Bad Gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # API + SSE streams (research events, chat) — buffering off so tokens flush live.
    location /v1/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location /health {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # Prometheus scrapes the API directly over the Docker network. Do not expose
    # metric labels (or any accidentally high-cardinality data) through the SPA.
    location = /metrics {
        return 404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
