# Public share links carry their bearer token in the path (/r/<token> in the SPA,
# /v1/public/research/<token> in the API), and the page's own asset/API requests
# repeat it in the Referer. stdout is shipped to Loki, so log a redacted copy of both.
map $request_uri $redacted_request_uri {
    default $request_uri;
    "~^(?<share_uri_head>/(?:v1/public/research|r)/)[^/?]+(?<share_uri_tail>.*)$" "${share_uri_head}[redacted]${share_uri_tail}";
}

map $http_referer $redacted_http_referer {
    default $http_referer;
    "" "-";
    "~^(?<share_ref_head>https?://[^/]+/(?:v1/public/research|r)/)[^/?]+(?<share_ref_tail>.*)$" "${share_ref_head}[redacted]${share_ref_tail}";
}

# The stock "main" format, with the request line and Referer redacted.
log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $redacted_request_uri $server_protocol" '
                    '$status $body_bytes_sent "$redacted_http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

# Referrer-Policy of the SPA's pages. Cross-origin requests send only the origin, so a
# page path never reaches cited sites. The share page sends no Referer at all, not even
# to this server: its asset and API requests would otherwise repeat the token. Keyed on
# $request_uri because it keeps the original path after the SPA fallback's internal
# redirect to /index.html; case-insensitive because vue-router matches paths that way.
map $request_uri $spa_referrer_policy {
    default "strict-origin-when-cross-origin";
    "~*^/+r/" "no-referrer";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log redacted;

    # Docker internal DNS resolver — dynamically resolves upstream IPs every 10s
    # so restarts/recreations of backend containers do not cause persistent 502 Bad Gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # Content-Security-Policy of the SPA, checked against the production build.
    set $spa_csp "default-src 'self'";
    # The only inline script is index.html's pre-render theme switch. Its hash is listed
    # for LF and for CRLF line endings (a Windows checkout with core.autocrlf=true builds
    # the CRLF one). Edit that script and these hashes together; the web test
    # src/securityHeaders.test.ts fails when they drift.
    set $spa_csp "${spa_csp}; script-src 'self' 'sha256-admEvxNad39t8detxDrjspmtSFyywhE4lXMxEBYWDqU=' 'sha256-1I72qtY+50Hnj9yXzfie+9Oxy4eG54q+HZv0dSDynBE='";
    # KaTeX math and Vue's pre-rendered static markup carry style="" attributes, so
    # inline styles are allowed as attributes only. Stylesheets come from the bundle and
    # Google Fonts. The plain style-src line is the fallback for browsers without the
    # -elem/-attr directives.
    set $spa_csp "${spa_csp}; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com";
    set $spa_csp "${spa_csp}; style-src-elem 'self' https://fonts.googleapis.com";
    set $spa_csp "${spa_csp}; style-src-attr 'unsafe-inline'";
    # KaTeX fonts are bundled (the smallest is inlined as a data: URL); text fonts come
    # from Google Fonts.
    set $spa_csp "${spa_csp}; font-src 'self' data: https://fonts.gstatic.com";
    # Avatars, source favicons and report images are arbitrary https: URLs; markdown
    # also renders data: images.
    set $spa_csp "${spa_csp}; img-src 'self' data: https:";
    # fetch and SSE go to the API on this origin (/v1/, proxied below). A build with
    # VITE_API_BASE pointing at another origin must add that origin here.
    set $spa_csp "${spa_csp}; connect-src 'self'";
    # Google sign-in is a top-level navigation to /v1/auth/google/login, which CSP does
    # not restrict; the app's forms are handled in script and never submitted natively.
    set $spa_csp "${spa_csp}; object-src 'none'; base-uri 'none'; form-action 'self'";
    set $spa_csp "${spa_csp}; frame-ancestors 'none'";

    # Security headers of every SPA response. nginx drops these inherited add_header
    # directives in any location that has an add_header of its own, so each such
    # location repeats them (src/securityHeaders.test.ts checks that it does).
    # X-Frame-Options covers browsers without CSP frame-ancestors.
    add_header Content-Security-Policy $spa_csp always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy $spa_referrer_policy always;

    # API + SSE streams (research events, chat) — buffering off so tokens flush live.
    location /v1/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # nginx is the edge, so overwrite (never append to) the client's forwarding
        # headers: uvicorn trusts X-Forwarded-For (--forwarded-allow-ips), and the login
        # rate limiter and audit logs key on the address it yields. There is no
        # Cloudflare in front of this proxy, so a CF-Connecting-IP header is forged.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;

        # API responses (JSON, SSE, CSV, redirects) load nothing, so they get the
        # strictest policy and the API's own no-referrer. The API sets nosniff,
        # X-Frame-Options and Referrer-Policy itself, but not on every response (a CSRF
        # rejection skips that middleware), so nginx replaces them: once, everywhere.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    location /health {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";

        # The API's header set, as on /v1/.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # Prometheus scrapes the API directly over the Docker network. Do not expose
    # metric labels (or any accidentally high-cardinality data) through the SPA.
    location = /metrics {
        return 404;
    }

    # index.html points at content-hashed bundles, so browsers must revalidate it on
    # every load; a cached copy after a deploy requests bundles that no longer exist.
    # The SPA fallback and the `index` for "/" both land here through an internal
    # redirect to /index.html, while the hashed assets keep nginx's default caching.
    location = /index.html {
        add_header Cache-Control "no-cache";
        # The server-level security headers, repeated (see above).
        add_header Content-Security-Policy $spa_csp always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy $spa_referrer_policy always;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
