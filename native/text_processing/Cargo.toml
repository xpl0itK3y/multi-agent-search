[package]
name = "multi_agent_search_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "multi_agent_search_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Enabled by maturin + the build script for the Python extension build; left OFF under
# `cargo test` so the test binary links libpython normally and unit tests can run (AUD-037).
extension-module = ["pyo3/extension-module"]

