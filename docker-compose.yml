x-worker-base: &worker-base
  build:
    context: .
    dockerfile: Dockerfile
  depends_on:
    migrate:
      condition: service_completed_successfully
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  env_file:
    - .env
  environment:
    POSTGRES_HOST: pgbouncer
    POSTGRES_PORT: 5432
    REDIS_URL: redis://redis:6379/0
    USE_REDIS_BROKER: "true"
    LOG_FORMAT: json
  command: ["python", "scripts/run_finalize_worker.py"]
  restart: unless-stopped

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multi-agent-search-api
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      USE_REDIS_BROKER: "true"
      LOG_FORMAT: json
      API_WORKERS: "2"
    # Multiple uvicorn worker processes for request/SSE concurrency. Safe across workers:
    # startup recovery is single-flighted (Redis lock), queue promotion claims atomically,
    # and SSE wakes via Redis pub/sub shared by all workers.
    command: sh -c "uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --workers $${API_WORKERS:-2}"
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: multi-agent-search-web
    depends_on:
      api:
        condition: service_started
    ports:
      - "8501:80"
    restart: unless-stopped

  worker:
    <<: *worker-base
    container_name: multi-agent-search-worker
    environment:
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 5432
      WORKER_NAME: job-worker

  worker_2:
    <<: *worker-base
    container_name: multi-agent-search-worker-2
    environment:
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 5432
      WORKER_NAME: job-worker-2

  worker_3:
    <<: *worker-base
    container_name: multi-agent-search-worker-3
    environment:
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 5432
      WORKER_NAME: job-worker-3

  redis:
    image: redis:7-alpine
    container_name: multi-agent-search-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: multi-agent-search-db
    # Raise max_connections so the API + workers' bigger pools fit (default is 100).
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-multi_agent_search}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-multi_agent_search}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Connection pooler: multiplexes many app connections onto few Postgres backends
  # (transaction mode), so the API + workers can scale without exhausting Postgres.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: multi-agent-search-pgbouncer
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-app}
      DB_NAME: ${POSTGRES_DB:-multi_agent_search}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      MIN_POOL_SIZE: "5"
    ports:
      - "6432:5432"  # edoburu/pgbouncer listens on 5432 inside the container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-app} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multi-agent-search-migrate
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      LOG_FORMAT: json
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: multi-agent-search-prometheus
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    container_name: multi-agent-search-loki
    ports:
      - "3100:3100"
    volumes:
      - ./ops/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.3.2
    container_name: multi-agent-search-promtail
    volumes:
      - ./ops/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: multi-agent-search-grafana
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  loki_data:
