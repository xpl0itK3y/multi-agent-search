# Tooling configuration only — dependency/packaging metadata intentionally lives in
# requirements.txt / requirements.lock (see CI-TOOLING notes in the repo docs).
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["venv", "web", "native", "alembic/versions"]

[tool.ruff.lint]
# Conservative starting set: pyflakes + the pycodestyle subsets that catch real bugs
# (unused imports/variables, lambda assignment, statement-level issues). Style-only
# rules (E5xx line length, formatting) are deliberately out until the codebase is
# formatted once as a dedicated change.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
markers = [
    "postgres: requires a running Postgres database configured for the application",
]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["src/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# The backend-unit CI job (memory store, `-m "not postgres"`) measured 79.5% when the
# floor was set; fail_under = that, rounded down, minus 1. Raise it as coverage grows.
fail_under = 78
