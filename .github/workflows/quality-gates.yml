name: Quality Gates

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: Native Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Run native text-processing tests
        run: cargo test --manifest-path native/text_processing/Cargo.toml

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    env:
      TASK_STORE_BACKEND: memory
      ALLOW_MEMORY_TASK_STORE: "true"
      AUTH_DISABLED: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Lint (ruff)
        # Pinned tool deps stay out of requirements.lock (app runtime is unaffected).
        run: |
          python -m pip install ruff==0.16.8
          ruff check src/ scripts/ eval/ tests/
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Run backend unit tests with coverage
        run: |
          python -m pip install pytest-cov
          python -m pytest -q -m "not postgres" --cov=src --cov-report=term --cov-report=xml

  frontend:
    name: Frontend typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx vue-tsc --noEmit
      - name: Run frontend tests
        run: npm run test

  prometheus-rules:
    name: Prometheus alert rules
    runs-on: ubuntu-latest
    env:
      # Same digest-pinned image as docker-compose.yml, so CI checks the rules with the
      # promtool that ships with the Prometheus that loads them.
      PROMETHEUS_IMAGE: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Check alert rules
        run: docker run --rm --entrypoint promtool -v "$PWD/ops/prometheus:/rules:ro" "$PROMETHEUS_IMAGE" check rules /rules/alerts.yml
      - name: Unit-test alert rules
        run: docker run --rm --entrypoint promtool -v "$PWD/ops/prometheus:/rules:ro" "$PROMETHEUS_IMAGE" test rules /rules/alerts.test.yml

  eval:
    name: Offline evaluation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Run offline evaluation gate
        run: python -m eval --fixtures eval/fixtures --gate
