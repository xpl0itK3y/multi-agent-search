name: Quality Gates

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    env:
      TASK_STORE_BACKEND: memory
      ALLOW_MEMORY_TASK_STORE: "true"
      AUTH_DISABLED: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Run backend unit tests
        run: python -m pytest -q -m "not postgres"

  frontend:
    name: Frontend typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx vue-tsc --noEmit
      - name: Run frontend tests
        run: npm run test

  eval:
    name: Offline evaluation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Run offline evaluation gate
        run: python -m eval --fixtures eval/fixtures --gate
