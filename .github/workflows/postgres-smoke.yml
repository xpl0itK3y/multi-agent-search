name: Postgres Smoke

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: multi_agent_search
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d multi_agent_search"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DEEPSEEK_API_KEY: test-key
      TASK_STORE_BACKEND: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: multi_agent_search
      # The smoke exercises persistence and queue transitions, not authentication.
      # Bootstrap otherwise rejects the development JWT-secret default before Uvicorn
      # can bind its health endpoint.
      AUTH_DISABLED: "true"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.lock

      - name: Run migrations
        run: python -m alembic upgrade head

      - name: Run postgres runtime smoke
        run: python scripts/smoke_postgres_runtime.py
