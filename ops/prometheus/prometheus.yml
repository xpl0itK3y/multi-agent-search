global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "multi-agent-search-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: "multi-agent-search-workers"
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]
        labels:
          worker: job-worker
      - targets: ["worker_2:9102"]
        labels:
          worker: job-worker-2
      - targets: ["worker_3:9103"]
        labels:
          worker: job-worker-3
